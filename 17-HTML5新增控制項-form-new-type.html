<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 新增控制項 - form 2</title>
    <link rel="stylesheet" href="./styles/form.css" />
  </head>
  <body>
    <h1>HTML5 新增控制項</h1>
    <form action="#">
      <fieldset>
        <legend>日期控制項</legend>
        <div class="box">
          <label for="myDate" class="t1">date</label>
          <input
            type="date"
            name="userDate"
            id="myDate"
            value="2026-04-10"
            min="2026-04-10"
            max="2026-04-23"
          />
        </div>
        <div class="box">
          <label for="myDatetimeLocal" class="t1">datetime-local</label>
          <input
            type="datetime-local"
            name="userDatetimeLocal"
            id="myDatetimeLocal"
            value="2026-04-09T12:10"
            min="2026-04-09T12:00"
            max="2026-04-10T13:43"
          />
        </div>
        <div class="box">
          <label for="myTime" class="t1">time</label>
          <input
            type="time"
            name="userTime"
            id="myTime"
            value="11:25"
            min=""
            max=""
          />
        </div>
        <div class="box">
          <label for="myMonth" class="t1">month</label>
          <input type="month" name="userMonth" id="myMonth" value="2025-11" />
        </div>
        <div class="box">
          <label for="myWeek" class="t1">week</label>
          <input type="week" name="userWeek" id="myWeek" value="2026-W01" />
        </div>
      </fieldset>

      <fieldset>
        <legend>文字相關控制項</legend>
        <div class="box">
          <label for="myEmail" class="t1">email</label>
          <input type="email" name="userEmail" id="myEmail" />
        </div>
        <div class="box">
          <label for="myUrl" class="t1">url</label>
          <input
            type="url"
            name="userUrl"
            id="myUrl"
            placeholder="https://www.example.com"
            value="https://"
          />
        </div>
        <div class="box">
          <label for="myTel" class="t1">tel</label>
          <input type="tel" name="userTel" id="myTel" />
        </div>
        <div class="box">
          <label class="t1" for="mySearch">search</label>
          <input type="search" name="userSearch" id="mySearch" />
        </div>
      </fieldset>

      <div class="btns">
        <input type="submit" />
      </div>
    </form>
  </body>
</html>
