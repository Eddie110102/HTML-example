<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景樣式 - background</title>
    <style>
      .box {
        width: 800px;
        height: 800px;
        border: 2px solid black;

        /* 文字 */
        color: white;
        font-size: 150px;
        text-align: center;

        /* 背景色 */
        background-color: lightblue;

        /* 背景圖 */
        /* background-image: url(./images/space.jpg); */
        /* https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHI3bWJzdnBreThxa2JyMHZlZTYwNHM0cWNtaGd6cTF2eXRuNjBjNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/pY8jLmZw0ElqvVeRH4/giphy.gif */
        background-image: url(https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHI3bWJzdnBreThxa2JyMHZlZTYwNHM0cWNtaGd6cTF2eXRuNjBjNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/pY8jLmZw0ElqvVeRH4/giphy.gif);


        /* 背景圖重複 */
        background-repeat: no-repeat;

        /* 背景圖尺寸 */
        background-size: 300px;
        /* 裁切 */
        /* background-size: cover; */
        /* 顯示完整圖片 */
        /* background-size: contain; */

        /* 背景圖位置 */
        /* background-position: left center; */
        background-position: 100px 300px;
      }
    </style>
  </head>
  <body>
    <h1>背景樣式</h1>
    <div class="box"></div>
  </body>
</html>
