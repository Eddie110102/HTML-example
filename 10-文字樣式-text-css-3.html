<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字樣式 - text css - 3</title>
    <style>
      p {
        font-size: 30px;
      }
      .under {
        text-decoration-line: underline;
      }
      .over {
        text-decoration-line: overline;
      }
      .through {
        text-decoration-line: line-through;
      }

      .double {
        text-decoration-style: double;
      }
      .wavy {
        text-decoration-style: wavy;
      }
      .dashed {
        text-decoration-style: dashed;
      }

      .red{
        text-decoration-color: red;
        color: red;
      }
      .green{
        text-decoration-color: green;
        color: green;
      }

      .blue{
        text-decoration-color: blue;
        color: blue;
      }

      .all{
        text-decoration: underline dashed salmon;
        color: salmon;
      }
      .none{
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>文字樣式</h1>
    <h2>文字裝飾</h2>
    <h3>線條位置</h3>
    <p>段落元素</p>
    <p class="under">段落元素</p>
    <p class="over">段落元素</p>
    <p class="through">段落元素</p>
    <h3>線條樣式</h3>
    <p class="under double">段落元素</p>
    <p class="over wavy">段落元素</p>
    <p class="through dashed">段落元素</p>

    <h3>線條顏色</h3>
    <p class="under double red">段落元素</p>
    <p class="over wavy green">段落元素</p>
    <p class="through dashed blue">段落元素</p>

    <h3>速寫</h3>
    <p class="all">段落元素</p>
    <a href="https://www.google.com" target="_blank" class="none">超連結</a>
    <hr />
  </body>
</html>
