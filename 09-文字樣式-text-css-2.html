<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字樣式 - text css - 2</title>
    <!-- 外部引入的檔案或是樣式 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=LXGW+WenKai+Mono+TC&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 引入字型 */
      @font-face {
        /* 下面的選擇器使用此字型時要如何命名 */
        font-family: "Cursive_Script";
        /* 此字型的來源(伺服器中位子) */
        src: url(./fonts/Cursive_Script.ttf);
      }

      p {
        font-size: 30px;
      }

      .font1 {
        font-family: "新細明體";
      }
      .font2 {
        font-family: "標楷體";
      }

      .cursive-script {
        font-family: "Cursive_Script";
      }

      .google1 {
        font-family: "LXGW WenKai Mono TC", monospace;
      }

      .google2 {
        font-family: "Playwrite IE", cursive;
      }

      .font4 {
        font-style: normal;
      }
      .font5 {
        font-style: italic;
      }
      .font6 {
        font-style: oblique;
      }

      .font7 {
        text-transform: uppercase;
      }
      .font8 {
        text-transform: lowercase;
      }
      .font9 {
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <h1>文字樣式</h1>
    <h2>文字字型</h2>
    <p>預設字體 abcdef 123456</p>
    <p class="font1">新細明體 abcdef 123456</p>
    <p class="font2">標楷體 abcdef 123456</p>
    <p class="cursive-script">中文字 Cursive Script 123456</p>
    <p class="google1">Google 字型 1</p>
    <p class="google2">Google 字型 2</p>

    <hr />
    <h2>文字樣式</h2>
    <p class="font4">正常字體</p>
    <p class="font5">斜體</p>
    <p class="font6">斜角體</p>

    <hr />
    <h2>文字轉換</h2>
    <p>AbCd eFgHi JKL</p>
    <p class="font7">AbCd eFgHi JKL</p>
    <p class="font8">AbCd eFgHi JKL</p>
    <p class="font9">AbCd eFgHi JKL</p>
  </body>
</html>
