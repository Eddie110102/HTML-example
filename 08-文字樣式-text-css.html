<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字樣式 - text css</title>
  </head>
  <body>
    <h1>文字樣式</h1>
    <h2>文字顏色</h2>
    <p style="color: #268023">段落元素</p>

    <hr />
    <h2>文字大小</h2>
    <span style="font-size: 30px">文字大小 30px</span>
    <span style="font-size: 8px">文字大小 8px</span>
    <span style="color: red">文字大小（預設文字大小）</span>
    <span style="font-size: 70%">文字大小 70%</span>
    <span style="font-size: 2em">文字大小 2em</span>
    <span style="font-size: 2rem">文字大小 2rem</span>

    <hr />
    <div style="font-size: 40px;">
      <span style="font-size: 30px">文字大小 30px</span>
      <span style="font-size: 8px">文字大小 8px</span>
      <span style="color: red">文字大小（預設文字大小）</span>
      <span style="font-size: 70%">文字大小 70%</span>
      <span style="font-size: 2em">文字大小 2em</span>
      <span style="font-size: 2rem">文字大小 2rem</span>
    </div>

    <hr>

    <div style="font-size: 5em"> <!-- 80px -->
      <span style="font-size: 30px">文字大小 30px</span>
      <span style="font-size: 8px">文字大小 8px</span>
      <span style="color: red">文字大小（預設文字大小）</span>
      <span style="font-size: 70%">文字大小 70%</span>
      <span style="font-size: 2em">文字大小 2em</span>
      <span style="font-size: 2rem">文字大小 2rem</span>
    </div>

    <hr />
    <h2>文字粗細</h2>
    <p style="font-size: 100px;font-weight: 100;">文字粗細</p>
  </body>
</html>
