<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表單元素 - form</title>
    <link rel="stylesheet" href="./styles/form.css" />
  </head>
  <body>
    <h1>表單元素</h1>
    <form action="#" method="get" enctype="application/x-www-form-urlencoded">
      <div class="box">
        <!-- 單行文字控制項 -->
        <label for="myName" class="t1">姓名</label>
        <input
          type="text"
          name="userName"
          id="myName"
          placeholder="請輸入您的大名"
          value="王曉明"
        />
        <!-- userName=王曉明 -->
      </div>
      <div class="box">
        <!-- 密碼控制項 -->
        <label for="myPassword" class="t1">密碼</label>
        <input
          type="password"
          name="userPassword"
          id="myPassword"
          placeholder="請輸入6-8位數字密碼"
          value="123456"
          maxlength="8"
          minlength="6"
        />
      </div>
      <div class="box">
        <!-- 多行文字控制項 -->
        <label for="myMemo" class="t1">備忘錄</label>
        <textarea
          name="userMemo"
          id="myMemo"
          placeholder="最大上限500字。"
          cols="30"
          rows="10"
          maxlength="500"
        >
預設內容</textarea
        >
      </div>

      <div class="box">
        <!-- 單選題 -->
        <span class="t1">性別</span>

        <input type="radio" name="userGender" id="male" value="male" />
        <label for="male">男性</label>

        <input type="radio" name="userGender" id="female" value="female" />
        <label for="female">女性</label>

        <label for="hidden">
          <input
            type="radio"
            name="userGender"
            id="hidden"
            value="hidden"
            checked
          />
          不提供
        </label>
      </div>

      <div class="box">
        <span class="t1">複選題</span>

        <input
          type="checkbox"
          name="userMultipleCheckbox"
          id="option1"
          value="option1"
        />
        <label for="option1">選項1</label>
        <input
          type="checkbox"
          name="userMultipleCheckbox"
          id="option2"
          value="option2"
        />
        <label for="option2">選項2</label>
        <input
          type="checkbox"
          name="userMultipleCheckbox"
          id="option3"
          value="option3"
          checked
        />
        <label for="option3">選項3</label>
        <input
          type="checkbox"
          name="userMultipleCheckbox"
          id="option4"
          value="option4"
          checked
        />
        <label for="option4">選項4</label>
      </div>

      <div class="btns">
        <!-- 按鈕 -->
        <input type="submit" value="送出" />
        <input type="reset" value="清除" />
        <!-- <button type="submit">送出</button>
  <button type="reset">重設</button> -->
        <!-- 一般按鈕 -->
        <input type="button" value="一般按鈕" disabled />
        <button type="button" disabled>一般按鈕</button>
      </div>
    </form>
  </body>
</html>
